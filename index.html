<script>
const MODULOS = [
{
 id: 1, peso: 20, nome: "Sistema financeiro, economia e regras do mercado",
 resumo: "Quem manda, quem fiscaliza, como a economia funciona, juros e matemática financeira.",
 secoes: [
 { t: "1. Quem é quem no Sistema Financeiro Nacional (SFN)", h: `
<p>O SFN é o conjunto de órgãos e empresas que cuidam do dinheiro no Brasil. Para a prova, guarde a divisão em três grupos: <b>quem cria as regras</b>, <b>quem fiscaliza</b> e <b>quem opera</b>.</p>
<table>
<tr><th>Área</th><th>Quem faz as regras (normativo)</th><th>Quem fiscaliza (supervisor)</th></tr>
<tr><td>Moeda, crédito e bancos</td><td>CMN (Conselho Monetário Nacional)</td><td>Banco Central (BC)</td></tr>
<tr><td>Mercado de valores mobiliários (ações, fundos, debêntures)</td><td>CMN (diretrizes) e a própria CVM (normas)</td><td>CVM (Comissão de Valores Mobiliários)</td></tr>
<tr><td>Seguros, capitalização e previdência aberta</td><td>CNSP (Conselho Nacional de Seguros Privados)</td><td>SUSEP</td></tr>
<tr><td>Previdência fechada (fundos de pensão)</td><td>CNPC (Conselho Nacional de Previdência Complementar)</td><td>PREVIC</td></tr>
</table>
<div class="box prova"><b>Cai na prova:</b> o CMN <u>não executa</u> nada. Ele só define as regras gerais. Quem executa e fiscaliza é o Banco Central. O CMN é formado pelo Ministro da Fazenda (presidente), pelo Ministro do Planejamento e Orçamento e pelo Presidente do Banco Central.</div>
<h4>O que o Banco Central faz</h4>
<ul>
<li>Executa a política monetária (controla a quantidade de dinheiro e os juros).</li>
<li>Fiscaliza os bancos e demais instituições financeiras.</li>
<li>Emite o papel-moeda (cédulas e moedas).</li>
<li>Cuida da estabilidade do sistema e do Pix.</li>
<li>Persegue a meta de inflação, que é definida pelo CMN.</li>
</ul>
<h4>Quem opera no sistema (principais)</h4>
<ul>
<li><b>Bancos e caixas econômicas:</b> recebem depósitos, emprestam e prestam serviços.</li>
<li><b>Cooperativas de crédito:</b> pertencem aos próprios associados (cooperados).</li>
<li><b>Corretoras e distribuidoras:</b> compram e vendem títulos e valores mobiliários para os clientes.</li>
<li><b>Instituições de pagamento:</b> contas de pagamento, cartões, carteiras digitais. Não podem emprestar com o dinheiro do cliente.</li>
<li><b>Administradoras de consórcio:</b> organizam grupos de consórcio.</li>
<li><b>SCFI (financeiras):</b> financiamento ao consumidor (CDC).</li>
<li><b>Companhias hipotecárias e SCI:</b> crédito imobiliário.</li>
<li><b>Agências de fomento:</b> financiam o desenvolvimento regional.</li>
<li><b>B3:</b> a bolsa de valores e também ambiente de balcão organizado.</li>
<li><b>Seguradoras, EAPC e sociedades de capitalização:</b> seguros, previdência aberta e títulos de capitalização.</li>
<li><b>EFPC (fundos de pensão):</b> previdência fechada, para empregados de uma empresa ou categoria.</li>
</ul>
<h4>Autorreguladores e proteção</h4>
<ul>
<li><b>Anbima:</b> associação do mercado. Cria códigos de conduta e dá o selo e as certificações (como a CPA).</li>
<li><b>Apimec, Planejar e Ancord:</b> certificam analistas, planejadores financeiros e agentes autônomos.</li>
<li><b>FGC (Fundo Garantidor de Créditos):</b> protege o cliente se a instituição quebrar. Cobre até <b>R$ 250 mil por CPF, por instituição</b>, com limite global de <b>R$ 1 milhão a cada 4 anos</b>. Cobre: conta corrente, poupança, CDB, RDB, LCI, LCA e letras de câmbio. <u>Não cobre</u>: fundos de investimento, ações, debêntures, CRI, CRA, COE e títulos públicos.</li>
<li><b>FGCoop:</b> faz o mesmo papel do FGC para cooperativas de crédito.</li>
</ul>
`},
 { t: "2. Economia e política econômica", h: `
<h4>Fluxo circular da renda</h4>
<p>A economia é um circuito. <b>Famílias</b> trabalham para as <b>empresas</b> e recebem salário. Com o salário, compram produtos das empresas. O <b>governo</b> cobra impostos e devolve em serviços e gastos. O <b>mercado financeiro</b> liga quem poupa a quem precisa de crédito.</p>
<h4>Subdivisões do mercado financeiro</h4>
<ul>
<li><b>Mercado monetário:</b> controle da liquidez e dos juros de curtíssimo prazo.</li>
<li><b>Mercado de crédito:</b> empréstimos e financiamentos (bancos).</li>
<li><b>Mercado de capitais:</b> recursos de longo prazo, com ações, debêntures e fundos.</li>
<li><b>Mercado cambial:</b> compra e venda de moeda estrangeira.</li>
</ul>
<h4>Política fiscal</h4>
<p>É a política de gastos e impostos do governo. Quando o governo gasta mais do que arrecada, tem <b>déficit</b> e precisa se endividar (vende títulos públicos). A <b>Lei de Responsabilidade Fiscal</b> existe para obrigar o governo a manter as contas equilibradas. Mais gasto do governo tende a aquecer a economia e pode pressionar a inflação e os juros.</p>
<h4>Política monetária</h4>
<p>É o controle do dinheiro em circulação e dos juros. Quem faz é o Banco Central, por meio do <b>Copom</b>.</p>
<table>
<tr><th></th><th>Expansionista</th><th>Contracionista</th></tr>
<tr><td>Objetivo</td><td>Estimular a economia</td><td>Segurar a inflação</td></tr>
<tr><td>Juros</td><td>Baixa a Selic</td><td>Sobe a Selic</td></tr>
<tr><td>Crédito</td><td>Fica mais barato e abundante</td><td>Fica mais caro e escasso</td></tr>
</table>
<h4>Instrumentos da política monetária</h4>
<ul>
<li><b>Open market:</b> o BC compra e vende títulos públicos para tirar ou colocar dinheiro no mercado. É o principal instrumento no dia a dia.</li>
<li><b>Depósito compulsório:</b> parte dos depósitos que os bancos são obrigados a deixar parados no BC. Aumentar o compulsório reduz o dinheiro disponível para emprestar.</li>
<li><b>Redesconto:</b> empréstimo do BC a um banco com falta de liquidez (instrumento de última instância).</li>
</ul>
<h4>Copom, meta Selic, Selic e CDI</h4>
<ul>
<li><b>Copom:</b> Comitê de Política Monetária. Se reúne 8 vezes por ano e define a <b>meta da taxa Selic</b>.</li>
<li><b>Meta Selic:</b> o alvo que o Copom decide.</li>
<li><b>Taxa Selic (over):</b> a taxa que de fato ocorre nas operações com títulos públicos de um dia.</li>
<li><b>CDI (taxa DI):</b> taxa dos empréstimos de um dia entre bancos. Anda sempre muito próxima da Selic. É a referência para renda fixa e fundos.</li>
<li><b>Regime de metas para a inflação:</b> o CMN define a meta e o BC usa os juros para alcançá-la. A meta é medida pelo <b>IPCA</b>.</li>
</ul>
<div class="box dica"><b>Macete:</b> inflação alta, o Copom <u>sobe</u> a Selic. Com juros altos, o crédito encarece, o consumo cai e a inflação desacelera. Juros altos também deixam os títulos de renda fixa mais atrativos e derrubam o preço das ações.</div>
<h4>Política cambial</h4>
<ul>
<li><b>Câmbio flutuante:</b> o preço do dólar varia com oferta e demanda (regime do Brasil, com intervenções pontuais do BC).</li>
<li><b>Câmbio fixo:</b> o governo trava o valor da moeda.</li>
<li><b>Reservas internacionais:</b> dólares e outros ativos que o BC guarda.</li>
<li><b>Swap cambial:</b> instrumento que o BC usa para atuar no câmbio sem vender dólar à vista.</li>
<li><b>PTAX:</b> média das taxas de câmbio do dia calculada pelo BC. Serve de referência para contratos.</li>
<li><b>Câmbio turismo x comercial:</b> turismo é para pessoas em viagem. Comercial é para empresas (importação e exportação).</li>
<li><b>Taxa nominal x real:</b> a nominal é a cotação que você vê. A real desconta a inflação dos dois países.</li>
</ul>
<h4>Indicadores</h4>
<table>
<tr><th>Indicador</th><th>O que é</th><th>Quem calcula</th></tr>
<tr><td>PIB</td><td>Tudo o que o país produz. Soma: consumo + investimento + gastos do governo + (exportações − importações)</td><td>IBGE</td></tr>
<tr><td>IPCA</td><td>Inflação oficial, usada na meta</td><td>IBGE</td></tr>
<tr><td>IGP-M</td><td>Índice de preços amplo. Muito usado em reajuste de aluguel</td><td>FGV</td></tr>
<tr><td>IPA</td><td>Preços no atacado (compõe o IGP)</td><td>FGV</td></tr>
<tr><td>IPC-Fipe</td><td>Inflação na cidade de São Paulo</td><td>Fipe</td></tr>
<tr><td>Taxa de desemprego</td><td>% de pessoas que procuram trabalho e não acham</td><td>IBGE</td></tr>
<tr><td>TR</td><td>Taxa referencial de juros, usada na poupança e no FGTS</td><td>BC</td></tr>
</table>
<h4>Os três riscos básicos</h4>
<ul>
<li><b>Risco de mercado:</b> perder dinheiro porque os preços mudaram (juros, câmbio, bolsa).</li>
<li><b>Risco de crédito:</b> o devedor não pagar.</li>
<li><b>Risco de liquidez:</b> não conseguir vender o ativo rápido sem perder valor.</li>
</ul>
`},
 { t: "3. Matemática financeira essencial", h: `
<h4>Juros simples e juros compostos</h4>
<p><b>Simples:</b> os juros incidem sempre sobre o valor inicial. <b>Compostos:</b> os juros incidem sobre o valor já corrigido (juros sobre juros).</p>
<ul>
<li>Simples: <b>M = C × (1 + i × n)</b></li>
<li>Composto: <b>M = C × (1 + i)<sup>n</sup></b></li>
</ul>
<p><i>Exemplo:</i> R$ 1.000 a 10% ao ano por 2 anos. Simples: 1.000 × (1 + 0,10 × 2) = <b>R$ 1.200</b>. Composto: 1.000 × 1,10² = <b>R$ 1.210</b>.</p>
<h4>Taxa nominal, efetiva e real (Fisher)</h4>
<p>A taxa <b>nominal</b> é a anunciada. A <b>real</b> é o ganho verdadeiro depois de descontar a inflação. Fórmula de Fisher:</p>
<p><b>(1 + nominal) = (1 + real) × (1 + inflação)</b></p>
<p><i>Exemplo:</i> investimento rendeu 10% e a inflação foi 4%. Real = 1,10 ÷ 1,04 − 1 = <b>5,77%</b> (e não 6%).</p>
<h4>Taxas prefixada e pós-fixada</h4>
<ul>
<li><b>Prefixada:</b> você sabe a taxa no dia da compra (ex.: 12% ao ano).</li>
<li><b>Pós-fixada:</b> segue um indexador (CDI, Selic, IPCA). A taxa final só aparece no vencimento.</li>
<li><b>Híbrida:</b> indexador + taxa fixa (ex.: IPCA + 6%).</li>
</ul>
<h4>Taxas equivalentes</h4>
<p>No juro composto, 1% ao mês <u>não</u> é 12% ao ano. É (1,01)¹² − 1 = <b>12,68% ao ano</b>. No juro simples, a taxa é proporcional (1% ao mês = 12% ao ano).</p>
<h4>Desconto</h4>
<ul>
<li><b>Desconto comercial (por fora):</b> a taxa incide sobre o valor de face (valor do título no vencimento). D = N × d × n. É o desconto bancário simples, usado na antecipação de recebíveis (duplicatas, cheques).</li>
<li><b>Desconto racional (por dentro):</b> a taxa incide sobre o valor atual.</li>
</ul>
<p><i>Exemplo:</i> duplicata de R$ 10.000 antecipada 60 dias antes, taxa de desconto de 3% ao mês. D = 10.000 × 0,03 × 2 = R$ 600. Você recebe <b>R$ 9.400</b>.</p>
<h4>Sistemas de amortização</h4>
<table>
<tr><th></th><th>SAC</th><th>Price (tabela Price)</th></tr>
<tr><td>Amortização</td><td>Constante</td><td>Crescente</td></tr>
<tr><td>Parcela</td><td>Começa alta e diminui</td><td>Constante (igual do início ao fim)</td></tr>
<tr><td>Juros</td><td>Diminuem</td><td>Diminuem</td></tr>
<tr><td>Custo total</td><td>Menor</td><td>Maior</td></tr>
</table>
<p><i>Exemplo SAC:</i> financiamento de R$ 120.000 em 120 meses. Amortização fixa = 120.000 ÷ 120 = <b>R$ 1.000 por mês</b>. Os juros são calculados sobre o saldo devedor.</p>
<h4>Outros conceitos</h4>
<ul>
<li><b>Valor presente (VP) e valor futuro (VF):</b> quanto vale hoje e quanto vale mais à frente um valor.</li>
<li><b>VPL (valor presente líquido):</b> soma dos fluxos futuros trazidos a valor de hoje, menos o investimento. VPL positivo: o projeto vale a pena.</li>
<li><b>TIR (taxa interna de retorno):</b> a taxa que zera o VPL. Se a TIR é maior que o custo de oportunidade, o projeto compensa.</li>
<li><b>Payback:</b> tempo para recuperar o dinheiro investido. Investiu R$ 30.000 e recebe R$ 5.000 por ano: payback de 6 anos.</li>
<li><b>Custo de oportunidade:</b> o que você deixa de ganhar na melhor alternativa.</li>
<li><b>Taxa livre de risco:</b> a taxa de um título sem risco de calote (no Brasil, a Selic/títulos públicos).</li>
<li><b>Duration:</b> prazo médio ponderado de recebimento dos fluxos de um título. Mede a sensibilidade do preço a mudanças nos juros. Quanto maior, mais o preço oscila.</li>
<li><b>Taxa bruta x líquida:</b> bruta é antes do imposto, líquida é depois.</li>
<li><b>CMPC:</b> custo médio ponderado de capital, ou seja, o custo médio do dinheiro da empresa (dívida + capital próprio).</li>
<li><b>Alavancagem:</b> usar dinheiro de terceiros para ampliar o retorno. Amplia também o risco.</li>
</ul>
`},
 { t: "4. Infraestrutura e regulação do mercado", h: `
<h4>Infraestruturas do mercado financeiro (IMFs)</h4>
<table>
<tr><th>Peça</th><th>Para que serve</th></tr>
<tr><td>SPB (Sistema de Pagamentos Brasileiro)</td><td>Conjunto de regras e sistemas que movimentam o dinheiro entre instituições (TED, DOC, Pix, cartões).</td></tr>
<tr><td>SPI (Sistema de Pagamentos Instantâneos)</td><td>Infraestrutura do Pix, operada pelo BC. Funciona 24 horas por dia, todos os dias.</td></tr>
<tr><td>Selic (sistema)</td><td>Custódia e liquidação dos títulos públicos federais. Operado pelo BC.</td></tr>
<tr><td>B3</td><td>Bolsa e balcão. Faz negociação, registro, depósito central de ações e atua como contraparte central.</td></tr>
<tr><td>Contraparte central (clearing)</td><td>Fica no meio de toda negociação e garante o pagamento. Reduz o risco de a outra parte não cumprir (risco de contraparte).</td></tr>
<tr><td>Depositário central</td><td>Guarda os ativos de forma centralizada (custódia).</td></tr>
<tr><td>Entidade registradora</td><td>Registra operações e recebíveis para evitar duplicidade.</td></tr>
<tr><td>BSM</td><td>Supervisiona o mercado de bolsa e balcão organizado (braço de supervisão da B3).</td></tr>
</table>
<h4>Estabilidade financeira</h4>
<ul>
<li><b>Risco sistêmico:</b> a quebra de uma instituição que contamina todo o sistema (efeito dominó).</li>
<li><b>Comef:</b> comitê do BC para a estabilidade financeira.</li>
<li><b>Depósito compulsório e linhas de liquidez (LLI e LLT):</b> ferramentas para dar fôlego aos bancos.</li>
<li><b>Acordos de Basileia (I, II e III):</b> regras internacionais que exigem que os bancos tenham capital mínimo e liquidez, para aguentar crises. A Basileia III reforçou o capital e criou regras de liquidez e de alavancagem.</li>
<li><b>Desintermediação financeira:</b> o cliente passa a investir direto, sem passar pelo banco (fintechs, plataformas, bolsa).</li>
</ul>
<h4>Classificação dos investidores (Resolução CVM 30)</h4>
<table>
<tr><th>Tipo</th><th>Regra principal</th></tr>
<tr><td>Profissional</td><td>Instituições financeiras, fundos, e pessoas físicas com mais de <b>R$ 10 milhões</b> em investimentos financeiros que declaram por escrito essa condição.</td></tr>
<tr><td>Qualificado</td><td>Todo profissional, mais pessoas físicas com mais de <b>R$ 1 milhão</b> em investimentos financeiros (com declaração), e quem tem certificações específicas.</td></tr>
<tr><td>Geral (varejo)</td><td>Os demais.</td></tr>
</table>
<p>Essa classificação libera o acesso a produtos mais complexos e de maior risco (ex.: algumas ofertas restritas e fundos exclusivos).</p>
<h4>Lei da Liberdade Econômica (Lei 13.874/2019)</h4>
<p>Garante o livre mercado e reduz a burocracia para abrir e tocar negócios. Princípio: a liberdade é a regra e a intervenção do Estado é a exceção.</p>
<h4>Autorregulação Anbima e Código de Distribuição</h4>
<ul>
<li>Organiza as regras de conduta para quem distribui produtos de investimento.</li>
<li><b>Conheça sua clientela (KYC):</b> cadastro e documentação do cliente.</li>
<li><b>Suitability:</b> adequar o produto ao perfil do cliente (objetivo, situação financeira, conhecimento).</li>
<li><b>Publicidade:</b> informação clara e sem prometer rentabilidade.</li>
<li><b>Transparência na remuneração:</b> o cliente deve saber como o distribuidor é remunerado.</li>
<li><b>Portabilidade:</b> transferir produtos de investimento entre instituições.</li>
<li><b>Private:</b> regras específicas para clientes de alta renda.</li>
</ul>
<div class="box prova"><b>Cai na prova:</b> entender quem faz o quê. Exemplo típico: "qual instituição fiscaliza fundos de investimento?" É a CVM. "Qual faz a custódia e liquidação dos títulos públicos?" É o Selic.</div>
`}
 ]

 { t: "1. Renda fixa: títulos públicos", h: `
<p>Renda fixa é quando você empresta dinheiro e as regras do ganho são conhecidas desde o início. Quem pega o dinheiro é o <b>emissor</b>. O governo emite <b>títulos públicos</b>, que são os de menor risco do país.</p>
<table>
<tr><th>Título</th><th>Nome no Tesouro Direto</th><th>Como rende</th><th>Juros periódicos?</th></tr>
<tr><td>LTN</td><td>Tesouro Prefixado</td><td>Taxa fixa</td><td>Não</td></tr>
<tr><td>NTN-F</td><td>Tesouro Prefixado com Juros Semestrais</td><td>Taxa fixa</td><td>Sim (semestral)</td></tr>
<tr><td>LFT</td><td>Tesouro Selic</td><td>Taxa Selic + pequeno ágio ou deságio</td><td>Não</td></tr>
<tr><td>NTN-B Principal</td><td>Tesouro IPCA+</td><td>IPCA + taxa fixa</td><td>Não</td></tr>
<tr><td>NTN-B</td><td>Tesouro IPCA+ com Juros Semestrais</td><td>IPCA + taxa fixa</td><td>Sim (semestral)</td></tr>
</table>
<ul>
<li><b>Tesouro Selic:</b> o de menor oscilação de preço. Bom para reserva de emergência.</li>
<li><b>Tesouro Educa+:</b> variação do IPCA+ pensada para pagar estudos de filhos e dependentes.</li>
<li><b>Tesouro Renda+:</b> variação do IPCA+ pensada para complementar a renda na aposentadoria.</li>
<li><b>Tesouro Direto:</b> plataforma pela qual a pessoa física compra títulos públicos pela internet. Todo o processo é feito por meio de uma corretora ou banco.</li>
<li><b>Marcação a mercado:</b> o preço do título muda todo dia conforme os juros. Se vender antes do vencimento, pode ganhar ou perder. Se levar até o vencimento, recebe o combinado.</li>
</ul>
<div class="box dica"><b>Macete:</b> juros de mercado <u>sobem</u>, o preço de títulos prefixados <u>cai</u>. Juros de mercado <u>caem</u>, o preço <u>sobe</u>.</div>
`},
 { t: "2. Renda fixa: títulos bancários e privados", h: `
<table>
<tr><th>Título</th><th>Quem emite</th><th>FGC?</th><th>IR para pessoa física</th></tr>
<tr><td>CDB</td><td>Banco</td><td>Sim</td><td>Tabela regressiva</td></tr>
<tr><td>RDB / RDC</td><td>Banco / cooperativa</td><td>Sim (RDB)</td><td>Tabela regressiva (RDB é não negociável)</td></tr>
<tr><td>LCI</td><td>Banco (lastro em crédito imobiliário)</td><td>Sim</td><td>Isento</td></tr>
<tr><td>LCA</td><td>Banco (lastro em crédito do agronegócio)</td><td>Sim</td><td>Isento</td></tr>
<tr><td>LC (Letra de Câmbio)</td><td>Financeira</td><td>Sim</td><td>Tabela regressiva</td></tr>
<tr><td>Debênture</td><td>Empresa S/A (dívida da empresa)</td><td>Não</td><td>Regressiva (as de infraestrutura/incentivadas são isentas para PF)</td></tr>
<tr><td>CRI</td><td>Securitizadora (lastro em imóveis)</td><td>Não</td><td>Isento</td></tr>
<tr><td>CRA</td><td>Securitizadora (lastro no agro)</td><td>Não</td><td>Isento</td></tr>
</table>
<ul>
<li><b>Debênture conversível:</b> pode virar ações da empresa. <b>Permutável:</b> pode virar ações de outra empresa.</li>
<li><b>Rating:</b> nota dada por agência de risco (como S&amp;P, Moody's, Fitch) que mostra a chance de calote. AAA é o melhor. Notas abaixo de BBB- são "grau especulativo".</li>
<li><b>Liquidez diária:</b> você pode resgatar a qualquer momento. Outros títulos só pagam no vencimento.</li>
<li><b>Carência:</b> prazo mínimo em que o título não pode ser resgatado.</li>
</ul>
<h4>Poupança</h4>
<ul>
<li>Rende todo mês na <b>data de aniversário</b> (dia do depósito). Se sacar antes, perde os rendimentos daquele mês.</li>
<li>Regra: com Selic <b>acima de 8,5% ao ano</b>, rende 0,5% ao mês + TR. Com Selic <b>igual ou abaixo de 8,5%</b>, rende 70% da Selic + TR.</li>
<li>Isenta de IR para pessoa física. Protegida pelo FGC. Liquidez diária.</li>
<li>Importante para o <b>SFH</b> (Sistema Financeiro da Habitação): parte do dinheiro dos depósitos é obrigatoriamente usada para financiar imóveis.</li>
</ul>
<h4>Impostos na renda fixa</h4>
<table>
<tr><th>Prazo da aplicação</th><th>Alíquota de IR (sobre o rendimento)</th></tr>
<tr><td>Até 180 dias</td><td>22,5%</td></tr>
<tr><td>De 181 a 360 dias</td><td>20%</td></tr>
<tr><td>De 361 a 720 dias</td><td>17,5%</td></tr>
<tr><td>Acima de 720 dias</td><td>15%</td></tr>
</table>
<ul>
<li>O IR incide <b>só sobre o rendimento</b>, não sobre o valor aplicado. É retido na fonte pela instituição, no resgate (no vencimento).</li>
<li><b>IOF:</b> só cobrado em resgate com <b>menos de 30 dias</b>. Começa em 96% do rendimento no 1º dia e chega a zero no 30º dia. Vem antes do IR.</li>
<li><b>Exemplo:</b> aplicou por 400 dias e teve R$ 1.000 de rendimento. IR = 17,5% × 1.000 = <b>R$ 175</b>.</li>
</ul>
<div class="box prova"><b>Cai na prova:</b> LCI, LCA, CRI, CRA e poupança são isentos de IR para pessoa física. CDB, RDB e Tesouro Direto pagam a tabela regressiva. Só CDB, RDB, LCI, LCA e poupança têm FGC. CRI, CRA e debêntures não têm.</div>
`},
 { t: "3. Renda variável: ações", h: `
<p>Renda variável é quando o ganho <b>não é conhecido de antemão</b>. A ação é uma <b>pedaço da empresa</b>. Quem compra vira sócio e pode ganhar com a alta do preço e com os dividendos.</p>
<h4>Tipos de empresa</h4>
<ul>
<li><b>Ltda.:</b> sócios com cotas. Não emite ações.</li>
<li><b>S/A (sociedade anônima):</b> capital dividido em ações.</li>
<li><b>S/A aberta:</b> pode vender ações ao público e é registrada na CVM. <b>S/A fechada:</b> não.</li>
<li><b>Listada:</b> negocia ações na bolsa (B3).</li>
</ul>
<h4>Tipos de ação</h4>
<table>
<tr><th>Tipo</th><th>Característica</th></tr>
<tr><td>Ordinária (ON, final 3)</td><td>Dá direito a voto nas assembleias.</td></tr>
<tr><td>Preferencial (PN, final 4)</td><td>Prioridade no recebimento de dividendos, em regra sem voto.</td></tr>
<tr><td>Unit</td><td>Pacote de ações negociadas juntas (ex.: 1 ON + 2 PN). Final 11.</td></tr>
<tr><td>BDR</td><td>Certificado que representa ações de empresas estrangeiras negociado no Brasil.</td></tr>
<tr><td>Bônus de subscrição</td><td>Direito de comprar ações novas, em geral com desconto.</td></tr>
</table>
<h4>Mercado primário x secundário</h4>
<ul>
<li><b>Primário:</b> a empresa vende ações pela primeira vez e o dinheiro vai para a empresa. Pode ser <b>IPO</b> (primeira oferta) ou <b>follow-on</b> (nova oferta depois do IPO).</li>
<li><b>Secundário:</b> investidores negociam entre si na bolsa. O dinheiro não vai para a empresa.</li>
<li><b>OPA:</b> Oferta Pública de Aquisição, quando alguém se oferece para comprar ações dos acionistas (por exemplo, para fechar o capital).</li>
</ul>
<h4>Eventos corporativos</h4>
<table>
<tr><th>Evento</th><th>O que acontece</th></tr>
<tr><td>Dividendos</td><td>Parte do lucro distribuída aos acionistas.</td></tr>
<tr><td>JCP (Juros sobre Capital Próprio)</td><td>Outra forma de distribuir lucro. A empresa deduz do imposto dela. O acionista recebe com <b>15% de IR retido na fonte</b>.</td></tr>
<tr><td>Desdobramento (split)</td><td>Cada ação vira várias. Mais ações, preço menor. O valor total não muda. (1 ação de R$ 40 vira 2 de R$ 20.)</td></tr>
<tr><td>Grupamento (inplit)</td><td>Várias ações viram uma. Menos ações, preço maior. O valor total não muda.</td></tr>
<tr><td>Bonificação</td><td>A empresa entrega ações novas gratuitas aos acionistas, vindas de reservas. (Bonificação de 10%: 100 ações viram 110.)</td></tr>
<tr><td>Subscrição</td><td>Direito de comprar ações novas, em geral na proporção das que já tem.</td></tr>
<tr><td>AGO</td><td>Assembleia Geral Ordinária: acontece todo ano, aprova as contas e destina o lucro.</td></tr>
<tr><td>AGE</td><td>Assembleia Geral Extraordinária: trata de assuntos específicos (estatuto, aumento de capital, fusão).</td></tr>
</table>
<h4>Índices</h4>
<ul>
<li><b>Ibovespa:</b> principal índice da bolsa. Carteira teórica das ações mais negociadas. Serve de termômetro do mercado.</li>
<li><b>IBrX 100 e IBrX 50:</b> as 100 e as 50 ações mais negociadas e representativas.</li>
</ul>
<h4>Governança corporativa e segmentos da B3</h4>
<p>Governança é o conjunto de regras que protege o acionista. Os segmentos de listagem da B3 vão do mais básico ao mais exigente: <b>Tradicional, Nível 1, Nível 2, Novo Mercado</b> (o mais exigente). Existe também o Bovespa Mais para empresas menores.</p>
<ul>
<li><b>Novo Mercado:</b> só pode ter ações ordinárias, com tag along de 100% e conselho de administração com membros independentes.</li>
<li><b>Tag along:</b> se o controlador vende a empresa, o acionista minoritário tem direito de vender suas ações pelo mesmo preço (ou por uma porcentagem dele).</li>
<li><b>Drag along:</b> o controlador pode obrigar os minoritários a vender junto numa venda.</li>
<li><b>Free float:</b> porcentagem das ações disponíveis para negociação no mercado.</li>
<li><b>Conselho de administração:</b> define a estratégia e fiscaliza a diretoria.</li>
</ul>
<h4>Imposto na renda variável (pessoa física)</h4>
<table>
<tr><th>Operação</th><th>Alíquota sobre o lucro</th><th>Detalhes</th></tr>
<tr><td>Swing trade (comprar e vender em dias diferentes)</td><td>15%</td><td>Isento se o total vendido no mês for até R$ 20 mil (ações)</td></tr>
<tr><td>Day trade (comprar e vender no mesmo dia)</td><td>20%</td><td>Sem isenção</td></tr>
</table>
<ul>
<li>O imposto é pago por conta do investidor, em <b>DARF</b>, até o último dia útil do mês seguinte.</li>
<li>Há uma retenção pequena na fonte ("dedo-duro") só para informar a Receita.</li>
<li><b>Compensação de perdas:</b> o prejuízo pode ser abatido de lucros futuros do mesmo tipo de operação.</li>
</ul>
<div class="box atencao"><b>Atenção:</b> as regras de imposto sobre dividendos mudaram para 2026 (nova lei sobre rendas altas). Para a prova, siga o enunciado e a regra vigente na data do exame. Confirme sempre no material oficial da Anbima.</div>
<h4>COE (Certificado de Operações Estruturadas)</h4>
<ul>
<li>Emitido por bancos. Combina um investimento em renda fixa com derivativos.</li>
<li><b>Capital protegido:</b> o valor aplicado volta no vencimento, mesmo que o cenário seja ruim.</li>
<li><b>Capital em risco:</b> pode perder parte ou até todo o valor.</li>
<li>Não tem cobertura do FGC. Paga IR regressivo (tabela da renda fixa).</li>
</ul>
`},
 { t: "4. Fundos de investimento", h: `
<p>Um fundo é um <b>condomínio</b>: um grupo de pessoas que junta o dinheiro para investir junto, com um gestor profissional. Cada pessoa tem <b>cotas</b>. O valor da cota muda todo dia conforme a carteira. A regra principal é a <b>Resolução CVM 175</b>.</p>
<h4>Quem é quem no fundo</h4>
<ul>
<li><b>Administrador:</b> responsável legal e pela parte operacional e de informação. Registra o fundo na CVM.</li>
<li><b>Gestor:</b> decide o que comprar e vender.</li>
<li><b>Custodiante:</b> guarda os ativos.</li>
<li><b>Distribuidor:</b> vende cotas ao cliente.</li>
<li>Administrador e gestor são os <b>serviços essenciais</b>.</li>
</ul>
<h4>Conceitos importantes (CVM 175)</h4>
<ul>
<li>O fundo pode ser dividido em <b>classes</b> e <b>subclasses</b> de cotas.</li>
<li><b>Segregação patrimonial:</b> o patrimônio do fundo é separado do patrimônio do administrador e do gestor.</li>
<li><b>Classe aberta:</b> aceita novos aplicadores e resgates a qualquer tempo, conforme o regulamento. <b>Classe fechada:</b> o investidor só sai no fim do prazo ou vendendo a cota na bolsa.</li>
<li><b>Assembleia de cotistas:</b> o cotista vota decisões importantes.</li>
<li><b>Patrimônio líquido negativo:</b> quando as dívidas do fundo passam do que ele tem. Se a responsabilidade é <b>limitada</b>, o cotista não paga além do que investiu. Se for <b>ilimitada</b>, o cotista pode ter de colocar dinheiro novo.</li>
</ul>
<h4>Taxas</h4>
<table>
<tr><th>Taxa</th><th>Quem paga e como</th></tr>
<tr><td>Administração</td><td>% ao ano sobre o patrimônio, cobrada todo dia.</td></tr>
<tr><td>Performance</td><td>Parte do que exceder um índice de referência (benchmark). Só vale se o fundo superar o benchmark e a "linha d'água".</td></tr>
<tr><td>Ingresso (entrada)</td><td>Cobrada quando você aplica.</td></tr>
<tr><td>Saída</td><td>Cobrada quando você resgata.</td></tr>
<tr><td>Distribuição</td><td>Remuneração do distribuidor.</td></tr>
</table>
<h4>Tipos de fundos financeiros (FIF) pela carteira</h4>
<table>
<tr><th>Tipo</th><th>Regra principal</th></tr>
<tr><td>Renda fixa</td><td>Pelo menos 80% em ativos ligados a juros ou índices de preços.</td></tr>
<tr><td>Ações</td><td>Pelo menos 67% em ações.</td></tr>
<tr><td>Cambial</td><td>Pelo menos 80% da carteira atrelada à variação do câmbio.</td></tr>
<tr><td>Multimercado</td><td>Livre, com várias classes de ativos, sem concentração obrigatória.</td></tr>
</table>
<h4>Imposto sobre fundos</h4>
<ul>
<li><b>Come-cotas:</b> antecipação de IR cobrada <b>duas vezes por ano</b> (último dia útil de maio e de novembro), tirando cotas do investidor. Vale para fundos de renda fixa e multimercados. Alíquota: <b>15%</b> para fundos de longo prazo e <b>20%</b> para curto prazo.</li>
<li><b>Fundo de longo prazo:</b> carteira com prazo médio acima de 365 dias. IR no resgate pela tabela de 22,5% a 15%, descontado o come-cotas.</li>
<li><b>Fundo de curto prazo:</b> prazo médio até 365 dias. IR de 22,5% até 180 dias e 20% depois.</li>
<li><b>Fundos de ações:</b> sem come-cotas. IR de <b>15%</b> só no resgate.</li>
<li><b>IOF</b> regressivo nos resgates com menos de 30 dias.</li>
</ul>
<h4>Fundos imobiliários (FII)</h4>
<ul>
<li>Cotas negociadas na bolsa (B3). O investidor <b>vende a cota a outro investidor</b>, não resgata do fundo.</li>
<li>Investe em imóveis, títulos imobiliários (CRI, LCI) ou cotas de outros FIIs.</li>
<li><b>Fundo de tijolo:</b> investe em imóveis físicos (shoppings, lajes, galpões). <b>Fundo de papel:</b> investe em títulos de crédito imobiliário (CRI). <b>Híbrido:</b> os dois.</li>
<li>Distribui por regra <b>pelo menos 95% do resultado</b> apurado, a cada semestre. Normalmente paga todo mês.</li>
<li>Riscos: liquidez (pouca negociação), vacância (imóveis vazios), crédito (inadimplência dos devedores) e mercado.</li>
<li>Imposto: os rendimentos mensais são <b>isentos de IR para pessoa física</b> em condições específicas (fundo negociado em bolsa, com no mínimo 100 cotistas, e o cotista com menos de 10% das cotas). O <b>ganho de capital</b> na venda da cota paga <b>20%</b>.</li>
</ul>
`},
 { t: "5. Previdência complementar (PGBL e VGBL)", h: `
<p>Previdência privada aberta é um produto de seguradora (EAPC) para juntar dinheiro no longo prazo. Tem duas fases: <b>acumulação</b> (você contribui) e <b>concessão/benefício</b> (você recebe).</p>
<table>
<tr><th></th><th>PGBL</th><th>VGBL</th></tr>
<tr><td>Para quem</td><td>Quem declara IR no <b>modelo completo</b> e contribui para o INSS ou outro regime</td><td>Quem usa o modelo simplificado, é isento ou já usou o limite de 12%</td></tr>
<tr><td>Benefício fiscal</td><td>Pode abater até <b>12% da renda bruta anual</b> tributável na declaração</td><td>Não tem</td></tr>
<tr><td>IR no resgate</td><td>Sobre o <b>valor total</b> (principal + rendimento)</td><td>Só sobre o <b>rendimento</b></td></tr>
</table>
<h4>Regimes de tributação (a pessoa escolhe)</h4>
<table>
<tr><th>Progressivo (compensável)</th><th>Regressivo (definitivo)</th></tr>
<tr><td>Segue a tabela do IR da pessoa física. Há retenção de 15% na fonte, ajustada na declaração.</td><td>Alíquota cai com o tempo: 35% (até 2 anos), 30% (2 a 4), 25% (4 a 6), 20% (6 a 8), 15% (8 a 10) e <b>10% (acima de 10 anos)</b>.</td></tr>
<tr><td>Bom para quem terá renda baixa na aposentadoria.</td><td>Bom para quem pretende deixar o dinheiro por muito tempo.</td></tr>
</table>
<ul>
<li><b>Não tem come-cotas.</b> Esse é um dos benefícios da previdência.</li>
<li><b>Taxa de administração:</b> % ao ano sobre o saldo. <b>Taxa de carregamento:</b> cobrada na entrada (sobre a contribuição) ou na saída.</li>
<li><b>Portabilidade:</b> trocar o plano de instituição sem pagar IR no ato. Pode ser entre planos do mesmo tipo.</li>
<li><b>Resgate:</b> dá para sacar antes, respeitando a carência do plano, mas há IR.</li>
</ul>
<h4>Como receber (transformação da reserva em renda)</h4>
<ul>
<li><b>Renda mensal vitalícia:</b> paga enquanto a pessoa viver.</li>
<li><b>Vitalícia com prazo mínimo garantido:</b> se morrer antes do prazo, os beneficiários recebem o resto.</li>
<li><b>Vitalícia com reversão ao beneficiário indicado:</b> continua para outra pessoa.</li>
<li><b>Vitalícia reversível ao cônjuge com continuidade aos menores:</b> vai para o cônjuge e depois aos filhos menores.</li>
<li><b>Renda temporária e por prazo certo:</b> paga por um período definido.</li>
<li><b>Pagamento único:</b> recebe tudo de uma vez.</li>
</ul>
<div class="box prova"><b>Cai na prova:</b> PGBL para quem usa o modelo completo de IR. VGBL para os demais. No regressivo, a alíquota mínima é 10% após 10 anos.</div>
`},
 { t: "6. Crédito e financiamento", h: `
<h4>Empréstimo, financiamento e leasing</h4>
<ul>
<li><b>Empréstimo:</b> o cliente recebe dinheiro livre para usar como quiser.</li>
<li><b>Financiamento:</b> o dinheiro tem destino certo (casa, carro). O bem geralmente fica como garantia (alienação fiduciária).</li>
<li><b>Leasing (arrendamento mercantil):</b> aluguel de um bem com opção de compra no final.</li>
</ul>
<h4>Como o banco avalia o crédito</h4>
<ul>
<li><b>Rating e score:</b> notas de risco do cliente (o score é calculado por empresas como Serasa).</li>
<li><b>Comprovação de renda:</b> mostra a capacidade de pagar.</li>
<li><b>SCR (Sistema de Informações de Crédito do BC):</b> mostra todas as dívidas do cliente no sistema financeiro.</li>
</ul>
<h4>Principais produtos</h4>
<table>
<tr><th>Produto</th><th>Ideia central</th></tr>
<tr><td>Cartão de crédito</td><td>Compra com vencimento posterior. Pagou o total: sem juros. Pagou o mínimo: o restante entra no <b>rotativo</b> e vira dívida com juros altos. O parcelamento da fatura costuma ser mais barato que o rotativo.</td></tr>
<tr><td>Cheque especial</td><td>Limite pré-aprovado na conta corrente. Juros altos (há teto de 8% ao mês por regulamento). Use só em emergência.</td></tr>
<tr><td>Crédito consignado</td><td>A parcela é descontada direto do salário ou benefício. Juros menores por ter risco menor. Tem limite de <b>margem consignável</b> (parte da renda que pode ser comprometida).</td></tr>
<tr><td>CDC</td><td>Crédito Direto ao Consumidor. Financia bens específicos (carro, eletrodoméstico). Pode ter o bem como garantia e prazo mais longo.</td></tr>
<tr><td>Crédito imobiliário</td><td>Compra de imóvel, com alienação fiduciária. Prazos longos (até 35 anos). SFH usa taxa mais baixa, com recursos da poupança e do FGTS.</td></tr>
<tr><td>Capital de giro</td><td>Crédito para a empresa pagar despesas do dia a dia.</td></tr>
<tr><td>Consórcio</td><td>Grupo de pessoas que se junta para formar uma poupança coletiva. <b>Não tem juros</b>, mas tem taxa de administração. A contemplação é por sorteio ou lance.</td></tr>
</table>
<div class="box dica"><b>Macete:</b> a taxa de juros depende do risco e da garantia. Quanto maior a garantia (casa, salário), menor o juro. Sem garantia (cartão rotativo, cheque especial), maior o juro.</div>
`},

 { t: "1. Finanças pessoais", h: `
<h4>Ciclo de vida do investidor</h4>
<table>
<tr><th>Fase</th><th>O que acontece</th><th>Foco</th></tr>
<tr><td>Acumulação de capital</td><td>Começo da vida profissional</td><td>Formar reserva e poupar</td></tr>
<tr><td>Crescimento patrimonial</td><td>Renda em alta, família e metas</td><td>Fazer o patrimônio crescer</td></tr>
<tr><td>Preservação de capital</td><td>Perto da aposentadoria</td><td>Proteger o que foi construído</td></tr>
<tr><td>Distribuição de renda</td><td>Aposentado</td><td>Viver do patrimônio</td></tr>
</table>
<p>Em geral, quanto mais jovem, maior a capacidade de aceitar risco (tem tempo para recuperar). Quanto mais perto de precisar do dinheiro, menor a exposição a risco.</p>
<h4>Orçamento e capacidade de poupança</h4>
<ul>
<li><b>Receitas − despesas = capacidade de poupança.</b></li>
<li>Despesas fixas (aluguel, escola), variáveis (lazer, mercado) e eventuais.</li>
<li>Primeiro passo: controlar gastos. Sem sobra não tem como investir.</li>
</ul>
<h4>Dívidas</h4>
<ul>
<li>Priorize pagar a dívida de <b>juros mais altos</b> (cartão rotativo, cheque especial).</li>
<li>Se a dívida é cara e há investimento com rendimento menor que o juro, pagar a dívida costuma compensar.</li>
<li>Escolha a dívida em função da necessidade: consignado ou garantia (mais barato) é melhor do que crédito sem garantia.</li>
</ul>
<h4>Reserva de emergência</h4>
<ul>
<li>Dinheiro para imprevistos (desemprego, saúde, conserto).</li>
<li>Tamanho: em geral de <b>3 a 6 meses</b> das despesas mensais. Para autônomos ou renda instável, de 6 a 12 meses.</li>
<li>Deve estar em ativo de <b>alta liquidez e baixo risco</b> (Tesouro Selic, CDB com liquidez diária, fundo DI).</li>
<li><i>Exemplo:</i> despesas de R$ 4.000 por mês, reserva de 6 meses = R$ 24.000.</li>
</ul>
<h4>Balanço patrimonial pessoal</h4>
<ul>
<li><b>Ativos:</b> o que você tem (conta, investimentos, imóvel, carro).</li>
<li><b>Passivos:</b> o que você deve (financiamento, cartão, empréstimos).</li>
<li><b>Patrimônio líquido = ativos − passivos.</b></li>
<li>Ativos de uso: casa onde mora, carro. Não geram renda. Ativos de não uso (investimentos): geram renda.</li>

<ul>

 { t: "2. Perfil do investidor e suitability", h: `
<h4>Perfis</h4>
<table>
<tr><th>Perfil</th><th>Característica</th><th>Produtos comuns</th></tr>
<tr><td>Conservador</td><td>Prioriza segurança, aceita pouco ou nenhum risco</td><td>Poupança, Tesouro Selic, CDB, fundos DI</td></tr>
<tr><td>Moderado</td><td>Aceita algum risco por mais retorno</td><td>Multimercados, fundos imobiliários, parte em ações</td></tr>
<tr><td>Arrojado (agressivo)</td><td>Aceita alto risco e oscilação por retorno maior</td><td>Ações, fundos de ações, COE de capital em risco</td></tr>
</table>
<p>O perfil depende de três coisas: <b>objetivo</b> (para que serve o dinheiro), <b>situação financeira</b> (renda, patrimônio) e <b>conhecimento</b> (experiência com investimentos). Também conta o <b>horizonte</b> (prazo).</p>
<h4>Relação entre risco, retorno e diversificação</h4>
<ul>
<li>Quanto maior o retorno esperado, maior o risco. Não existe retorno alto sem risco.</li>
<li><b>Diversificar</b> é espalhar o dinheiro em ativos diferentes para diminuir o risco. É a ideia de "não colocar todos os ovos na mesma cesta".</li>
</ul>
<h4>Suitability (adequação)</h4>
<p>É a obrigação de recomendar produtos <b>adequados</b> ao perfil do cliente. Princípios:</p>
<ul>
<li>Fazer o questionário e <b>guardar a documentação</b>.</li>
<li>Os produtos oferecidos precisam combinar com o perfil e com o objetivo do cliente.</li>
<li><b>Monitoramento contínuo:</b> o perfil deve ser atualizado em intervalos regulares (no máximo a cada 24 meses).</li>
<li>Linguagem <b>clara e transparente</b>: explicar riscos e custos.</li>
<li>Se o cliente quer um produto fora do perfil, o profissional alerta e o cliente assina um <b>termo de ciência</b>. O profissional não pode forçar nem esconder o risco.</li>
<li>Investidores profissionais podem ser dispensados do suitability.</li>
</ul>
<div class="box prova"><b>Cai na prova:</b> cliente conservador pedindo produto de alto risco. Resposta: explique os riscos, mostre alternativas adequadas e registre. Nunca prometa rentabilidade e nunca esconda o risco.</div>
`},
 { t: "3. Ética, atendimento e conflito de interesses", h: `
<h4>Código de Conduta Ética (Anbima)</h4>
<p>O nome oficial é <b>"Código de Conduta Ética para Pessoas Candidatas e Profissionais com Certificação da Anbima"</b>. Vale para quem quer a certificação e para quem já tem. O conteúdo dele pode cair na prova e na atualização da certificação.</p>
<h4>Os nove princípios éticos</h4>
<table>
<tr><th>#</th><th>Princípio</th><th>Ideia central</th></tr>
<tr><td>1</td><td>Comportamento ético</td><td>Manter reputação sólida, sem práticas que prejudiquem investidores, mercado, certificação ou Anbima.</td></tr>
<tr><td>2</td><td>Responsabilidade e vigilância</td><td>Assumir os próprios atos, com prudência e atenção, sem negligência.</td></tr>
<tr><td>3</td><td>Boa-fé e transparência</td><td>Atuar com transparência, diligência e lealdade, no melhor interesse do cliente.</td></tr>
<tr><td>4</td><td>Conformidade com as regras</td><td>Não violar o código, a regulação e os códigos Anbima.</td></tr>
<tr><td>5</td><td>Cumprimento das obrigações</td><td>Cumprir obrigações com o cuidado de uma pessoa prudente e diligente.</td></tr>
<tr><td>6</td><td>Atualização técnica</td><td>Buscar sempre melhorar o conhecimento sobre produtos, instituições e normas.</td></tr>
<tr><td>7</td><td>Independência e imparcialidade</td><td>Atuar de forma independente e declarar potenciais conflitos de interesse.</td></tr>
<tr><td>8</td><td>Honestidade e equidade</td><td>Manter os mais altos padrões de honestidade e integridade.</td></tr>
<tr><td>9</td><td>Sigilo de informações confidenciais</td><td>Guardar sigilo das informações confidenciais, inclusive as da Anbima.</td></tr>
</table>
<div class="box dica"><b>Macete para decorar:</b> <u>Ético</u>, <u>Responsável</u>, <u>Boa-fé</u>, <u>Conforme</u>, <u>Cumpre</u>, <u>Atualiza-se</u>, <u>Independente</u>, <u>Honesto</u>, <u>Sigiloso</u>.</div>
<h4>Regras para quem é candidato</h4>
<ul>
<li><b>Nunca</b> ofereça, peça ou aceite presente ou vantagem para obter benefício na certificação.</li>
<li><b>Nunca</b> se aproprie ou compartilhe o conteúdo dos exames. É fraude contra o processo.</li>
<li>Não use equipamento eletrônico de comunicação durante a prova.</li>
<li>Não use identidade falsa.</li>
<li>Não se apresente como certificado antes de obter a certificação, nem use certificação vencida.</li>
<li>Respeite os outros candidatos e cumpra o edital.</li>
</ul>
<h4>Regras para quem tem certificação</h4>
<ul>
<li>Nunca pratique conduta desonesta, fraudulenta, enganosa ou falsa.</li>
<li>Não adote condutas que prejudiquem a imagem da Anbima.</li>
<li>Seja transparente e evite conflitos prejudiciais ao mercado e ao investidor.</li>
<li>Não ofereça, peça ou aceite presente ou vantagem que comprometa sua reputação e integridade.</li>
<li>Conheça e cumpra as leis, as normas e o edital.</li>
</ul>
<h4>Deveres de quem tem CPA, C-Pro R e C-Pro I</h4>
<ul>
<li><b>Não</b> dê opinião nem faça previsão sem ter certeza de que a informação é correta e tem base técnica.</li>
<li><b>Não</b> prometa rentabilidade, não garanta resultado futuro e não diga que o produto não tem risco.</li>
<li>Garanta que produtos, serviços e operações sejam <b>adequados ao perfil</b>, às necessidades e aos objetivos do cliente.</li>
<li>Faça materiais <b>claros e compreensíveis</b>, com as informações essenciais para decidir.</li>
<li>Respeite a livre iniciativa e a livre concorrência. Evite concorrência desleal.</li>
<li>Dê informações <b>claras e inequívocas</b> sobre riscos e consequências.</li>
</ul>
<h4>Boas práticas de atendimento</h4>
<ul>
<li><b>Escuta ativa:</b> deixar o cliente falar e entender de verdade.</li>
<li><b>Personalização:</b> tratar cada cliente de acordo com a sua realidade.</li>
<li><b>Solução proativa:</b> antecipar problemas e propor soluções.</li>
<li><b>Educação continuada:</b> estudar sempre os produtos e serviços.</li>
<li><b>Gerenciar expectativas:</b> não prometer o que não pode entregar.</li>
</ul>
<h4>Conflitos de interesses</h4>
<p>Existem quando o interesse do profissional (ou da instituição) pode ficar contra o interesse do cliente. Exemplos: vender um produto só porque paga mais comissão, favorecer um parente, aceitar presentes de fornecedores.</p>
<p>Formas de gerenciar:</p>
<ul>
<li>Políticas claras, treinamento e educação.</li>
<li><b>Divulgação obrigatória</b> do conflito (declarar ao cliente).</li>
<li><b>Segregação de funções</b> (separar quem recomenda de quem executa).</li>
<li>Revisão e monitoramento contínuos.</li>
<li>Comitês de ética e compliance.</li>
<li>Proibição de certas atividades.</li>
</ul>
<h4>Riscos da atividade profissional</h4>
<ul>
<li><b>Operacional:</b> falhas de processo, erro humano, sistema.</li>
<li><b>Regulatório:</b> descumprir normas e ser punido.</li>
<li><b>Legal:</b> processos e sanções judiciais.</li>
<li><b>De imagem (reputação):</b> perder a confiança de clientes e do mercado.</li>
</ul>
`},
 { t: "4. Lavagem de dinheiro, fraudes e LGPD", h: `
<h4>Prevenção à lavagem de dinheiro e ao financiamento do terrorismo (PLDFT)</h4>
<p><b>Lavagem de dinheiro</b> é fazer o dinheiro de origem ilegal parecer legal. Costuma ter três etapas: <b>colocação</b> (entrar no sistema), <b>ocultação</b> (misturar e esconder a origem) e <b>integração</b> (voltar como dinheiro "limpo").</p>
<ul>
<li><b>Lei 9.613/1998:</b> a lei principal. Instituições financeiras são obrigadas a cumprir.</li>
<li><b>COAF (UIF):</b> unidade de inteligência que recebe as comunicações de operações suspeitas.</li>
<li><b>Abordagem baseada em risco:</b> a instituição avalia seus próprios riscos e adota controles proporcionais.</li>
<li><b>KYC (conheça seu cliente):</b> cadastro completo e atualizado, com análise da capacidade financeira. Cadastro desatualizado é um risco.</li>
<li><b>Conheça seu parceiro e seu funcionário:</b> o mesmo cuidado com quem a instituição contrata e faz negócios.</li>
<li><b>PEP (pessoa politicamente exposta):</b> exige atenção reforçada.</li>
<li><b>Operações suspeitas:</b> devem ser comunicadas ao COAF. É proibido <b>avisar o cliente</b> que ele foi comunicado.</li>
<li>Há comunicação automática para certas operações, como saques e depósitos em espécie de valor elevado.</li>
<li><b>Indisponibilidade de bens:</b> cumprimento imediato de ordens ligadas a resoluções do Conselho de Segurança da ONU.</li>
<li>Responsabilidade: a instituição e as <b>pessoas físicas</b> (inclusive o profissional) respondem administrativa e penalmente.</li>
</ul>
<h4>Fraudes eletrônicas</h4>
<ul>
<li><b>Phishing:</b> mensagem falsa para roubar dados.</li>
<li><b>Engenharia social:</b> enganar a pessoa para ela entregar informações.</li>
<li>O banco nunca pede senha completa, token ou código por telefone ou mensagem.</li>
</ul>
<h4>LGPD (Lei 13.709/2018)</h4>
<ul>
<li>Protege os <b>dados pessoais</b> das pessoas.</li>
<li>O tratamento de dados precisa de finalidade clara, necessidade e, em geral, <b>consentimento</b>.</li>
<li>O titular pode pedir acesso, correção e exclusão dos dados.</li>
<li>Fiscalização: <b>ANPD</b> (Autoridade Nacional de Proteção de Dados).</li>
<li><b>Sigilo bancário:</b> Lei Complementar 105/2001. As instituições devem conservar sigilo das operações. A exceção é quando há ordem judicial ou obrigação legal (como as comunicações ao COAF).</li>
</ul>
`},
 { t: "5. Crimes e ilícitos no mercado de capitais", h: `
<h4>Crimes (Lei 6.385/1976, arts. 27-C, 27-D e 27-E)</h4>
<table>
<tr><th>Crime</th><th>O que é</th></tr>
<tr><td>Manipulação de mercado (27-C)</td><td>Realizar operações para alterar artificialmente o preço, o volume ou a liquidez e enganar os investidores.</td></tr>
<tr><td>Uso indevido de informação privilegiada, ou insider trading (27-D)</td><td>Usar informação relevante, ainda não pública, para lucrar. Pode ser primário (quem tem acesso direto), secundário (quem recebe a informação) ou o repasse da informação.</td></tr>
<tr><td>Exercício irregular de cargo ou profissão (27-E)</td><td>Atuar sem autorização, como administrador de carteira ou agente sem registro.</td></tr>
</table>
<h4>Ilícitos de mercado (Resolução CVM 62)</h4>
<p>A norma tem <b>tipologia aberta</b>: não lista tudo. Qualquer prática que se enquadre no conceito geral pode ser punida.</p>
<table>
<tr><th>Categoria</th><th>Exemplos</th></tr>
<tr><td>Criação de condições artificiais</td><td><b>Money pass</b>: operação em que uma parte repassa ganhos ou perdas a outra de forma combinada, fora da realidade do mercado.</td></tr>
<tr><td>Manipulação de preços</td><td><b>Spoofing</b>: colocar ordens sem intenção de executar, só para enganar o mercado. <b>Layering</b>: ordens em várias camadas de preço para dar falsa impressão de demanda ou oferta. Manipulação de benchmark.</td></tr>
<tr><td>Operações fraudulentas</td><td><b>Churning</b>: operar demais na conta do cliente só para gerar corretagem.</td></tr>
<tr><td>Práticas não equitativas</td><td><b>Insider trading</b> e <b>front running</b>: operar na frente da ordem de um cliente, usando a informação privilegiada de que ele vai comprar ou vender.</td></tr>
</table>
<div class="box dica"><b>Macete:</b> spoofing = ordem "de mentira". Churning = "girar" a conta do cliente. Front running = "furar a fila" na frente do cliente. Money pass = "passar" o dinheiro.</div>
`}
 ]
},

 { t: "1. ESG e investimentos sustentáveis", h: `
<p><b>ESG</b> significa três letras: <b>E</b>nvironmental (ambiental), <b>S</b>ocial e <b>G</b>overnance (governança).</p>
<ul>
<li><b>Ambiental:</b> emissões de carbono, uso de água, energia limpa, desmatamento.</li>
<li><b>Social:</b> relações com funcionários, diversidade, direitos humanos, comunidade.</li>
<li><b>Governança:</b> ética, transparência, combate à corrupção, conselho e remuneração dos executivos.</li>
</ul>
<h4>Investimentos ESG</h4>
<p>Investir levando em conta os fatores ESG, além do retorno financeiro. Estratégias comuns:</p>
<ul>
<li><b>Exclusão (negative screening):</b> não investir em certos setores (armas, tabaco).</li>

 { t: "2. Finanças descentralizadas (DeFi), tokens e Drex", h: `
<ul>

<li><b>Smart contract (contrato inteligente):</b> programa que executa sozinho as regras combinadas quando as condições acontecem. Exemplos: empréstimos, seguros automáticos, compra e venda de imóveis.</li>

<li><b>NFT:</b> token não fungível (único), representa um item exclusivo.</li>
<li><b>Stablecoin:</b> criptomoeda com valor atrelado a algo estável (como o dólar).</li>
<li><b>Drex:</b> projeto de moeda digital do Banco Central (CBDC, sigla em inglês). É a versão digital do real, emitida pelo BC.</li>

</ul>

    <p>Duração: <b>2h30</b>. Aprovação: <b>35 acertos em 50 (70%)</b>. Taxa de inscrição: R$ 225. O exame mistura múltipla escolha, cases e árvore de diálogo.</p>
  </div>
  <div class="card">
    <h3>Sua leitura até agora</h3>
    <div class="bar"><i style="width:${Math.round(100*d/t)}%"></i></div>
    <p class="muted">${d} de ${t} seções lidas.</p>
    <button class="btn" onclick="go('modulos')">Começar a estudar</button>
  </div>
  <div class="card">
    <h3>Plano sugerido (4 semanas)</h3>
    <table>
      <tr><th>Semana</th><th>O que fazer</th></tr>
      <tr><td>1</td><td>Módulo 1 (leitura e exercícios). Comece o Módulo 2 pela renda fixa.</td></tr>
      <tr><td>2</td><td>Módulo 2 inteiro: renda variável, fundos, previdência, crédito. É o mais pesado, então leve o tempo que precisar.</td></tr>
      <tr><td>3</td><td>Módulos 3 e 4. Faça o Simulado 1.</td></tr>
      <tr><td>4</td><td>Revise os erros. Faça os Simulados 2 e Aleatório. Releia o Resumão.</td></tr>
    </table>
    <p class="muted">Estude de 45 a 60 minutos por dia. Constância vale mais do que maratona.</p>
  </div>
  <div class="card">
    <h3>Importante</h3>
    <ul>
      <li>Este material foi montado a partir do Programa Detalhado e do Edital da Anbima. Regras e valores (impostos, taxas, limites) podem mudar. <b>Confira sempre no site oficial da Anbima</b> antes da prova.</li>
      <li>As questões foram feitas para treino e não são as da prova real (a Anbima não divulga as questões).</li>
      <li>Seu progresso fica salvo neste navegador.</li>
    </ul>
  </div>`;
}

// ---------- módulos ----------
function vModulos(){
  if(sub==null){
    $("#app").innerHTML=`<h2>Módulos</h2><div class="grid">`+MODULOS.map(m=>{
      const t=m.secoes.length,d=m.secoes.filter((s,i)=>S.secoes[m.id+"-"+i]).length;
      return `<div class="card"><span class="pill">Bloco ${m.id} · ${m.peso}% da prova</span>
      <h3 style="margin-top:8px">${m.nome}</h3><p class="muted">${m.resumo}</p>
      <div class="bar"><i style="width:${Math.round(100*d/t)}%"></i></div><p class="muted">${d} de ${t} seções lidas</p>
      <button class="btn" onclick="go('modulos',${m.id})">Abrir módulo</button></div>`}).join("")+`</div>`;
    return;
  }
  const m=MODULOS.find(x=>x.id===sub);
  $("#app").innerHTML=`<p><button class="btn sec" onclick="go('modulos')">← Todos os módulos</button></p>
  <h2>Módulo ${m.id}: ${m.nome}</h2><p class="muted">Peso na prova: ${m.peso}%</p>`+
  m.secoes.map((s,i)=>{const k=m.id+"-"+i,ok=!!S.secoes[k];
    return `<div class="card"><h3>${s.t}</h3>${s.h}
    <p class="noprint"><button class="btn ${ok?"sec":""}" onclick="marca('${k}')">${ok?"✓ Lida (clique para desmarcar)":"Marcar como lida"}</button></p></div>`}).join("")+
  `<div class="card"><h3>Pronto para praticar?</h3><button class="btn" onclick="go('exercicios',${m.id})">Fazer exercícios do Módulo ${m.id}</button></div>`;
}
function marca(k){S.secoes[k]=!S.secoes[k];save();const y=window.scrollY;render();window.scrollTo(0,y)}

// ---------- exercícios (fixação) ----------
let fix=null;
function vExercicios(){
  if(fix){return drawFix()}
  $("#app").innerHTML=`<h2>Exercícios de fixação</h2><p class="muted">Responda e veja na hora se acertou, com a explicação. Sem tempo e sem pressão.</p><div class="grid">`+
  MODULOS.map(m=>{const n=FIXACAO.filter(q=>q[0]===m.id).length,h=S.fix[m.id];
    return `<div class="card"><span class="pill">Bloco ${m.id}</span><h3 style="margin-top:8px">${m.nome}</h3>
    <p class="muted">${n} questões${h?` · último resultado: ${h.a}/${h.t}`:""}</p>
    <button class="btn" onclick="startFix(${m.id})">Começar</button></div>`}).join("")+`</div>`;
  if(sub){startFix(sub);}
}
function startFix(b){fix={b,qs:shuffle(FIXACAO.filter(q=>q[0]===b)).map(prep),i:0,done:false};sub=null;drawFix()}
function drawFix(){
  const f=fix,q=f.qs[f.i];
  if(f.done){
    const a=f.qs.filter(x=>x.pick===x.ans).length;
    S.fix[f.b]={a,t:f.qs.length,d:Date.now()};save();
    const erradas=f.qs.filter(x=>x.pick!==x.ans);
    $("#app").innerHTML=`<div class="card"><h2>Resultado: ${a} de ${f.qs.length}</h2>
    <div class="bar"><i style="width:${Math.round(100*a/f.qs.length)}%"></i></div>
    <p class="muted">${a/f.qs.length>=0.7?"Bom resultado. Continue assim.":"Abaixo de 70%. Releia o módulo e tente de novo."}</p>
    <div class="row"><button class="btn" onclick="startFix(${f.b})">Refazer</button><button class="btn sec" onclick="go('exercicios')">Voltar</button><button class="btn sec" onclick="go('modulos',${f.b})">Reler módulo</button></div></div>`+
    (erradas.length?`<div class="card"><h3>Para revisar (${erradas.length})</h3>`+erradas.map(x=>`<p><b>${esc(x.q)}</b><br>Certa: ${esc(x.opts[x.ans])}<br><span class="muted">${esc(x.e)}</span></p>`).join("")+`</div>`:"");
    return;
  }
  $("#app").innerHTML=`<div class="card">
    <div class="row"><span class="pill">Bloco ${f.b}</span><span class="muted">Questão ${f.i+1} de ${f.qs.length}</span><span class="sp"></span><button class="btn sec" onclick="go('exercicios')">Sair</button></div>
    <h3 style="margin-top:12px">${esc(q.q)}</h3>
    ${q.opts.map((o,i)=>`<button class="opt ${q.pick!=null?(i===q.ans?"ok":(i===q.pick?"bad":"")):""}" ${q.pick!=null?"disabled":""} onclick="fixPick(${i})">${"ABCD"[i]}) ${esc(o)}</button>`).join("")}
    ${q.pick!=null?`<div class="exp"><b>${q.pick===q.ans?"Correto.":"Errado."}</b> ${esc(q.e)}</div>
      ${SMP?`<p><button class="btn sec" onclick="iaFix()">Explicar melhor com o Claude</button></p><div class="exp ia" id="ia" hidden></div>`:""}
      <p><button class="btn" onclick="fixNext()">${f.i+1<f.qs.length?"Próxima":"Ver resultado"}</button></p>`:""}
  </div>`;
}
function fixPick(i){fix.qs[fix.i].pick=i;drawFix()}
function fixNext(){if(fix.i+1<fix.qs.length){fix.i++}else{fix.done=true}drawFix()}

// ---------- simulados ----------
let sim=null;
function vSimulados(){
  if(sim){return drawSim()}
  const h=S.sims.slice(-5).reverse();
  $("#app").innerHTML=`<h2>Simulados</h2>
  <p class="muted">Condições da prova: 50 questões, 2h30 de cronômetro, mínimo de 35 acertos. Você pode finalizar antes. Evite consultar o material durante.</p>
  <div class="grid">
   <div class="card"><h3>Simulado 1</h3><p class="muted">50 questões fixas, distribuídas por bloco como na prova.</p><button class="btn" onclick="startSim(1)">Iniciar</button></div>
   <div class="card"><h3>Simulado 2</h3><p class="muted">50 questões fixas, diferentes do Simulado 1.</p><button class="btn" onclick="startSim(2)">Iniciar</button></div>
   <div class="card"><h3>Simulado aleatório</h3><p class="muted">50 questões sorteadas de todo o banco (${FIXACAO.length+SIMULADO1.length+SIMULADO2.length} questões). Muda a cada vez.</p><button class="btn" onclick="startSim(3)">Iniciar</button></div>
  </div>
  ${h.length?`<div class="card"><h3>Últimos simulados</h3><table><tr><th>Quando</th><th>Simulado</th><th>Acertos</th><th>Resultado</th></tr>`+
  h.map(x=>`<tr><td>${new Date(x.d).toLocaleString("pt-BR")}</td><td>${x.n}</td><td>${x.a}/${x.t}</td><td class="${x.a>=35?"pass":"fail"}">${x.a>=35?"Aprovado":"Reprovado"}</td></tr>`).join("")+`</table></div>`:""}`;
}
function startSim(n){
  let qs,nome;
  if(n===1){qs=SIMULADO1;nome="Simulado 1"}
  else if(n===2){qs=SIMULADO2;nome="Simulado 2"}
  else{
    const banco=FIXACAO.concat(SIMULADO1,SIMULADO2);qs=[];
    for(const b of [1,2,3,4]){qs=qs.concat(shuffle(banco.filter(q=>q[0]===b)).slice(0,PESOS[b]))}
    nome="Aleatório";
  }
  sim={n:nome,qs:shuffle(qs).map(prep),i:0,t:150*60,fim:false};
  startTimer();drawSim();
}
function startTimer(){
  stopTimer();
  timerH=setInterval(()=>{
    if(!sim||sim.fim){stopTimer();return}
    sim.t--; const el=$("#tm"); if(el)el.textContent=fmt(sim.t);
    if(sim.t<=0){finSim(true)}
  },1000);
}
function stopTimer(){if(timerH){clearInterval(timerH);timerH=null}}
function drawSim(){
  const s=sim;
  if(s.fim){return drawRes()}
  const q=s.qs[s.i],resp=s.qs.filter(x=>x.pick!=null).length;
  $("#app").innerHTML=`<div class="card">
    <div class="row"><b>${s.n}</b><span class="muted">Respondidas: ${resp}/${s.qs.length}</span><span class="sp"></span><span class="timer" id="tm">${fmt(s.t)}</span></div>
    <div class="qnav">${s.qs.map((x,i)=>`<button class="${x.pick!=null?"done":""} ${x.flag?"flag":""} ${i===s.i?"cur":""}" onclick="simGo(${i})">${i+1}</button>`).join("")}</div>
  </div>
  <div class="card">
    <div class="row"><span class="muted">Questão ${s.i+1} de ${s.qs.length}</span><span class="sp"></span><button class="btn sec" onclick="simFlag()">${q.flag?"Desmarcar revisão":"Marcar para revisar"}</button></div>
    <h3 style="margin-top:12px">${esc(q.q)}</h3>
    ${q.opts.map((o,i)=>`<button class="opt ${q.pick===i?"sel":""}" onclick="simPick(${i})">${"ABCD"[i]}) ${esc(o)}</button>`).join("")}
    <div class="row" style="margin-top:12px">
      <button class="btn sec" ${s.i===0?"disabled":""} onclick="simGo(${s.i-1})">Anterior</button>
      <button class="btn sec" ${s.i===s.qs.length-1?"disabled":""} onclick="simGo(${s.i+1})">Próxima</button>
      <span class="sp"></span>
      <button class="btn" onclick="finSim(false)">Finalizar simulado</button>
    </div>
  </div>`;
}
function simPick(i){sim.qs[sim.i].pick=i;drawSim()}
function simGo(i){sim.i=i;drawSim();window.scrollTo(0,0)}
function simFlag(){sim.qs[sim.i].flag=!sim.qs[sim.i].flag;drawSim()}
function finSim(auto,force){
  const vazias=sim.qs.filter(x=>x.pick==null).length;
  if(!auto && !force && vazias>0){ask("Ainda há "+vazias+" questão(ões) sem resposta. Finalizar mesmo assim?",()=>finSim(false,true));return}
  sim.fim=true;stopTimer();
  const a=sim.qs.filter(x=>x.pick===x.ans).length;
  S.sims.push({n:sim.n,a,t:sim.qs.length,d:Date.now(),
    b:[1,2,3,4].map(b=>{const l=sim.qs.filter(x=>x.b===b);return [l.filter(x=>x.pick===x.ans).length,l.length]})});
  save();drawRes();window.scrollTo(0,0);
}
function drawRes(){
  const s=sim,a=s.qs.filter(x=>x.pick===x.ans).length,t=s.qs.length,aprov=a>=35;
  const usado=150*60-s.t;
  const blocos=[1,2,3,4].map(b=>{const l=s.qs.filter(x=>x.b===b),c=l.filter(x=>x.pick===x.ans).length;return {b,c,n:l.length}});
  $("#app").innerHTML=`<div class="card">
    <h2>${s.n}: resultado</h2>
    <p><span class="big ${aprov?"pass":"fail"}">${a}/${t}</span> <span class="${aprov?"pass":"fail"}"><b>${aprov?"Aprovado":"Reprovado"}</b></span> <span class="muted">(mínimo: 35 acertos) · tempo usado: ${fmt(usado)}</span></p>
    <table><tr><th>Bloco</th><th>Acertos</th><th>%</th><th>Leitura</th></tr>
    ${blocos.map(x=>{const p=x.n?Math.round(100*x.c/x.n):0;return `<tr><td>${x.b}. ${NOMES[x.b]}</td><td>${x.c}/${x.n}</td><td>${p}%</td><td>${p>=70?"Bom":(p>=50?"Reforçar":"Estudar de novo")}</td></tr>`}).join("")}
    </table>
    <div class="row"><button class="btn" onclick="go('simulados')">Voltar aos simulados</button></div>
  </div>
  <div class="card"><h3>Correção comentada</h3>`+
  s.qs.map((q,i)=>{const ok=q.pick===q.ans;
    return `<div style="margin:14px 0;padding-bottom:12px;border-bottom:1px solid var(--line)">
    <b>${i+1}. ${esc(q.q)}</b> <span class="pill">Bloco ${q.b}</span><br>
    <span class="${ok?"pass":"fail"}">${q.pick==null?"Sem resposta":(ok?"Você acertou":"Você errou")}</span>
    ${q.pick!=null&&!ok?`<br>Sua resposta: ${esc(q.opts[q.pick])}`:""}
    <br>Correta: <b>${esc(q.opts[q.ans])}</b>
    <div class="exp">${esc(q.e)}</div>${SMP?`<p><button class="btn sec" onclick="iaSim(${i})">Explicar com o Claude</button></p><div class="exp ia" id="ia${i}" hidden></div>`:""}</div>`}).join("")+`</div>`;
}

// ---------- resumão ----------
function vResumo(){
  $("#app").innerHTML=`<h2>Resumão: o que mais cai</h2>
  <div class="card"><h3>Quem faz o quê</h3><table>
   <tr><th>Órgão</th><th>Papel</th></tr>
   <tr><td>CMN</td><td>Regras gerais (moeda e crédito) e meta de inflação. Não executa.</td></tr>
   <tr><td>Banco Central</td><td>Executa política monetária, fiscaliza bancos, emite moeda, Pix, Selic (sistema).</td></tr>
   <tr><td>CVM</td><td>Fiscaliza ações, debêntures, fundos.</td></tr>
   <tr><td>CNSP / SUSEP</td><td>Regras / fiscalização de seguros, capitalização e previdência aberta.</td></tr>
   <tr><td>CNPC / PREVIC</td><td>Regras / fiscalização da previdência fechada (fundos de pensão).</td></tr>
   <tr><td>Copom</td><td>Define a meta Selic (8 reuniões por ano).</td></tr>
   <tr><td>COAF</td><td>Recebe comunicações de operações suspeitas (lavagem).</td></tr>
   <tr><td>ANPD</td><td>Fiscaliza a LGPD.</td></tr>
   <tr><td>Anbima</td><td>Autorregulação e certificações.</td></tr>
  </table></div>
  <div class="card"><h3>Números para decorar</h3><table>
   <tr><th>Tema</th><th>Regra</th></tr>
   <tr><td>FGC</td><td>R$ 250 mil por CPF por instituição. Teto global de R$ 1 milhão a cada 4 anos.</td></tr>
   <tr><td>Quem tem FGC</td><td>Conta corrente, poupança, CDB, RDB, LCI, LCA, LC. Não tem: fundos, ações, debêntures, CRI, CRA, COE, títulos públicos.</td></tr>
   <tr><td>IR renda fixa</td><td>22,5% (até 180 dias) · 20% (181-360) · 17,5% (361-720) · 15% (acima de 720). Só sobre o rendimento.</td></tr>
   <tr><td>IOF renda fixa</td><td>Só até o 30º dia. Regressivo.</td></tr>
   <tr><td>Isentos de IR (PF)</td><td>Poupança, LCI, LCA, CRI, CRA, debêntures incentivadas.</td></tr>
   <tr><td>Poupança</td><td>Selic acima de 8,5%: 0,5% a.m. + TR. Selic até 8,5%: 70% da Selic + TR.</td></tr>
   <tr><td>Ações (PF)</td><td>Swing trade 15% (isento até R$ 20 mil vendidos no mês) · Day trade 20%.</td></tr>
   <tr><td>JCP</td><td>15% retido na fonte.</td></tr>
   <tr><td>Come-cotas</td><td>Maio e novembro. Longo prazo 15%, curto prazo 20%. Fundos de ações: sem come-cotas, 15% no resgate.</td></tr>
   <tr><td>Fundos por carteira</td><td>Renda fixa e cambial: 80%. Ações: 67%.</td></tr>
   <tr><td>FII</td><td>Distribui no mínimo 95% do resultado semestral. Ganho de capital 20%.</td></tr>
   <tr><td>PGBL</td><td>Dedução de até 12% da renda bruta anual. IR sobre o total. Modelo completo.</td></tr>
   <tr><td>VGBL</td><td>IR só sobre o rendimento.</td></tr>
   <tr><td>Regressivo</td><td>35% · 30% · 25% · 20% · 15% · 10% (2, 4, 6, 8, 10 anos e mais de 10).</td></tr>
   <tr><td>Investidor qualificado</td><td>Mais de R$ 1 milhão (com declaração).</td></tr>
   <tr><td>Investidor profissional</td><td>Mais de R$ 10 milhões (com declaração).</td></tr>
   <tr><td>Reserva de emergência</td><td>3 a 6 meses de despesas.</td></tr>
   <tr><td>Atualização do perfil</td><td>No máximo a cada 24 meses.</td></tr>
  </table></div>
  <div class="card"><h3>Títulos públicos</h3><table>
   <tr><th>Sigla</th><th>Nome</th><th>Indexador</th><th>Juros semestrais</th></tr>
   <tr><td>LTN</td><td>Tesouro Prefixado</td><td>Taxa fixa</td><td>Não</td></tr>
   <tr><td>NTN-F</td><td>Prefixado com Juros Semestrais</td><td>Taxa fixa</td><td>Sim</td></tr>
   <tr><td>LFT</td><td>Tesouro Selic</td><td>Selic</td><td>Não</td></tr>
   <tr><td>NTN-B Principal</td><td>Tesouro IPCA+</td><td>IPCA + taxa fixa</td><td>Não</td></tr>
   <tr><td>NTN-B</td><td>IPCA+ com Juros Semestrais</td><td>IPCA + taxa fixa</td><td>Sim</td></tr>
  </table></div>
  <div class="card"><h3>Fórmulas</h3><ul>
   <li>Juros simples: M = C × (1 + i × n)</li>
   <li>Juros compostos: M = C × (1 + i)<sup>n</sup></li>
   <li>Fisher: (1 + nominal) = (1 + real) × (1 + inflação)</li>
   <li>Desconto comercial: D = N × d × n. Valor recebido = N − D</li>
   <li>SAC: amortização = saldo ÷ nº de parcelas (constante). Parcelas decrescem.</li>
   <li>Price: parcela constante. Amortização cresce.</li>
   <li>Payback = investimento ÷ retorno periódico</li>
   <li>PL pessoal = ativos − passivos · Poupança = receitas − despesas</li>
   <li>PIB = C + I + G + (X − M)</li>
  </ul></div>
  <div class="card"><h3>Ilícitos (macetes)</h3><ul>
   <li><b>Spoofing:</b> ordem "de mentira" para enganar.</li>
   <li><b>Layering:</b> várias ordens em camadas de preço.</li>
   <li><b>Churning:</b> girar a conta do cliente para ganhar corretagem.</li>
   <li><b>Front running:</b> operar na frente da ordem do cliente.</li>
   <li><b>Money pass:</b> repasse combinado de resultados entre partes.</li>
   <li><b>Insider trading:</b> usar informação privilegiada (art. 27-D).</li>
   <li><b>Manipulação de mercado:</b> art. 27-C.</li>
   <li><b>Exercício irregular:</b> art. 27-E.</li>
  </ul></div>`;
}

// ---------- progresso ----------
function vProgresso(){
  const [d,t]=pctSecoes();
  const sims=S.sims;
  const med=b=>{const l=sims.filter(x=>x.b).map(x=>x.b[b-1]);const c=l.reduce((a,x)=>a+x[0],0),n=l.reduce((a,x)=>a+x[1],0);return n?Math.round(100*c/n):null};
  $("#app").innerHTML=`<h2>Seu progresso</h2>
  <div class="card"><h3>Leitura</h3><div class="bar"><i style="width:${Math.round(100*d/t)}%"></i></div><p class="muted">${d} de ${t} seções</p></div>
  <div class="card"><h3>Desempenho por bloco</h3>
  <table><tr><th>Bloco</th><th>Último exercício</th><th>Média nos simulados</th></tr>`+
  [1,2,3,4].map(b=>{const f=S.fix[b],m=med(b);return `<tr><td>${b}. ${NOMES[b]}</td><td>${f?f.a+"/"+f.t:"-"}</td><td>${m==null?"-":m+"%"}</td></tr>`}).join("")+
  `</table><p class="muted">Foque nos blocos abaixo de 70%.</p></div>
  <div class="card"><h3>Simulados feitos</h3>${sims.length?`<table><tr><th>Quando</th><th>Simulado</th><th>Acertos</th><th>Resultado</th></tr>`+
  sims.slice().reverse().map(x=>`<tr><td>${new Date(x.d).toLocaleString("pt-BR")}</td><td>${x.n}</td><td>${x.a}/${x.t}</td><td class="${x.a>=35?"pass":"fail"}">${x.a>=35?"Aprovado":"Reprovado"}</td></tr>`).join("")+`</table>`:`<p class="muted">Nenhum ainda.</p>`}
  </div>
  <p><button class="btn sec" onclick="ask('Apagar todo o progresso?',()=>{S={secoes:{},fix:{},sims:[]};save();render()})">Zerar progresso</button></p>`;
}
